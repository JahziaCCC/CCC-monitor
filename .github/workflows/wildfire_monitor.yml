name: Saudi Wildfire Intelligence V5.8

on:
  schedule:
    # تشغيل كل ساعة
    - cron: "0 * * * *"

  # إمكانية التشغيل اليدوي من GitHub
  workflow_dispatch:

# منع تشغيل نسختين من النظام في نفس الوقت
concurrency:
  group: wildfire-monitor
  cancel-in-progress: false

jobs:
  wildfire-monitor:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ======================================================
      # 1. تحميل المشروع
      # ======================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # 2. Python
      # ======================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # 3. تثبيت المتطلبات
      # ======================================================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ======================================================
      # 4. تشغيل نظام رصد الحرائق
      # ======================================================
      - name: Run Saudi Wildfire Intelligence V5.8
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIRMS_API_KEY: ${{ secrets.FIRMS_API_KEY }}

        run: |
          echo "=================================================="
          echo "🔥 Saudi Wildfire Intelligence V5.8"
          echo "=================================================="
          echo "🕒 Starting wildfire monitoring..."
          echo "🇸🇦 Saudi Arabia Polygon Validation: ENABLED"
          echo "🛰️ NASA FIRMS / VIIRS: ENABLED"
          echo "🧠 Temporal Persistence: ENABLED"
          echo "🧠 Historical Cluster Matching: ENABLED"
          echo "📈 Trend Analysis: ENABLED"
          echo "🚨 Telegram Alerts: ENABLED"
          echo "=================================================="

          python wildfire_monitor.py

      # ======================================================
      # 5. حفظ حالة النظام
      # ======================================================
      - name: Save Wildfire State
        if: always()
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add wildfire_state.json

          git diff --cached --quiet || \
            git commit -m "🔥 Update wildfire monitoring state"

          git push || true

      # ======================================================
      # 6. نهاية التشغيل
      # ======================================================
      - name: Monitoring Completed
        if: success()
        run: |
          echo "=================================================="
          echo "✅ Saudi Wildfire Intelligence V5.8 completed"
          echo "=================================================="

      - name: Monitoring Failed
        if: failure()
        run: |
          echo "=================================================="
          echo "❌ Wildfire monitoring execution failed"
          echo "=================================================="
